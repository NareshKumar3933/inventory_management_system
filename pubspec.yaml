name: inventory_management
description: "A complete Inventory Management System for academic purposes using Flutter, GetX, and Hive."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  uuid: ^4.5.1

  csv: ^6.0.0

  path_provider: ^2.1.5

  cupertino_icons: ^1.0.8

  fl_chart: ^0.69.2

  intl: ^0.19.0
  google_fonts: ^6.3.0
  web: ^1.1.1
  flutter_web_plugins:
    sdk: flutter
  data_table_2: ^2.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
